<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Muhammad Hassan Akbar — Senior Software Engineer</title>
  <desc id="desc">A dark blue developer profile banner with cyan and violet accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617" />
      <stop offset="0.55" stop-color="#0f172a" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#a78bfa" />
    </linearGradient>
    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientTransform="translate(1005 58) rotate(133) scale(350 280)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0ea5e9" stop-opacity=".22" />
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowViolet" cx="0" cy="0" r="1" gradientTransform="translate(144 339) rotate(-32) scale(390 250)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6" stop-opacity=".18" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#94a3b8" stroke-opacity=".055" />
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)" />
  <rect width="1200" height="360" rx="24" fill="url(#grid)" />
  <rect width="1200" height="360" rx="24" fill="url(#glowCyan)" />
  <rect width="1200" height="360" rx="24" fill="url(#glowViolet)" />

  <g opacity=".8">
    <circle cx="1048" cy="180" r="102" fill="none" stroke="#38bdf8" stroke-opacity=".13" />
    <circle cx="1048" cy="180" r="72" fill="none" stroke="#a78bfa" stroke-opacity=".16" />
    <path d="M982 180h132M1048 114v132" stroke="url(#accent)" stroke-opacity=".18" />
  </g>

  <g transform="translate(82 77)">
    <rect width="48" height="48" rx="12" fill="#0f172a" stroke="url(#accent)" stroke-width="2" />
    <path d="m18 16-8 8 8 8M30 16l8 8-8 8" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)" />

    <text x="0" y="106" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="51" font-weight="700" letter-spacing="-.8">Muhammad Hassan Akbar</text>
    <rect x="0" y="128" width="585" height="4" rx="2" fill="url(#accent)" />
    <text x="0" y="173" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24" font-weight="500">Senior Software Engineer</text>
    <text x="0" y="211" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18">React  •  TypeScript  •  Electron  •  Next.js</text>
  </g>

  <g transform="translate(981 154)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 8 3 26l12 18M119 8l12 18-12 18" stroke="#38bdf8" stroke-width="5" filter="url(#softGlow)" />
    <path d="m78 0-22 52" stroke="#a78bfa" stroke-width="5" filter="url(#softGlow)" />
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#334155" stroke-opacity=".65" stroke-width="2" />
</svg>
